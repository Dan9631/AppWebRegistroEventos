# Configuración común a desarrollo y producción.
#
#   Desarrollo:  docker compose up -d
#                (Compose agrega solo docker-compose.override.yml: puertos y valores locales)
#   Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#                (ver docs/despliegue-ec2.md)
#
# Aquí no se publica ningún puerto: cada entorno decide qué expone.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disagro
      # En producción se define en el .env de la raíz; en desarrollo vale "disagro".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disagro}
      POSTGRES_DB: disagro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disagro -d disagro"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./services/auth-service
    env_file: ./services/auth-service/.env
    environment:
      # Dentro de la red de Docker la base se llama "postgres", no "localhost"
      DATABASE_URL: postgresql://disagro:${POSTGRES_PASSWORD:-disagro}@postgres:5432/disagro?schema=auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  feria-service:
    build: ./services/feria-service
    env_file: ./services/feria-service/.env
    environment:
      DATABASE_URL: postgresql://disagro:${POSTGRES_PASSWORD:-disagro}@postgres:5432/disagro?schema=feria
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      auth-service:
        condition: service_healthy
      feria-service:
        condition: service_healthy

volumes:
  pgdata:
