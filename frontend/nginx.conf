server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen que el frontend: sin CORS y con la cookie
    # de sesión funcionando sin configuración extra. En AWS esto lo hace el balanceador.
    location /auth/ {
        proxy_pass http://auth-service:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos generados por Vite: llevan hash en el nombre, se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta (/login, /verificar, ...) la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
